    <div class="contact-info reveal">
        <h2 data-i18n="contact.title">Hablemos de tu logística</h2>

        <div class="office-card">

            <p><a href="mailto:comercial@mexsi.org">comercial@mexsi.org</a></p>
        </div>
        <div class="office-card">
            <h4>Veracruz</h4>

    <div class="contact-form reveal">
        <div class="form-title" data-i18n="form.title">Envíanos un mensaje</div>
        <div class="form-row">
        <div class="form-group">
            <label data-i18n="form.name">Nombre</label>
            <input type="text" data-i18n-ph="form.name.ph" placeholder="Tu nombre" />
        </div>
        <div class="form-group">
            <label data-i18n="form.company">Empresa</label>
            <input type="text" data-i18n-ph="form.company.ph" placeholder="Nombre de la empresa" />
        </div>
        </div>
        <div class="form-group">
        <label data-i18n="form.email">Email</label>
        <input type="email" data-i18n-ph="form.email.ph" placeholder="correo@empresa.com" />
        </div>
        <div class="form-group">
        <label data-i18n="form.service">Servicio de interés</label>
        <select>
            <option value="" data-i18n="form.service.ph">Selecciona un servicio</option>
            <option data-i18n="srv.0.title">Transporte Internacional FTL y LTL</option>
            <option data-i18n="srv.1.title">Transporte Nacional FTL y LTL</option>
            <option data-i18n="srv.2.title">Despacho Aduanal de Importación y Exportación</option>
            <option data-i18n="srv.3.title">Comercializadora General y Sectorial</option>
            <option data-i18n="srv.4.title">Certificaciones y Cumplimiento de NOMs y RNAs</option>
            <option data-i18n="srv.5.title">Seguro de Mercancías</option>
            <option data-i18n="srv.6.title">Custodia de Mercancías</option>
            <option data-i18n="srv.7.title">Capacitación y Consultoría</option>
        </select>
        </div>
        <div class="form-group">
        <label data-i18n="form.msg">Mensaje</label>
        <textarea data-i18n-ph="form.msg.ph" placeholder="Cuéntanos sobre tu operación..."></textarea>
        </div>
        <button class="form-submit" data-i18n="form.submit">Enviar mensaje →</button>
    </div>
